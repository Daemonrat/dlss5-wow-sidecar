name: Release

# A tag makes a release. Nothing else does -- an ordinary push must not publish
# anything, which is why this is a separate workflow from ci.yml rather than a
# branch of it.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v0.3.1. Must already exist.'
        required: true

permissions:
  contents: write

env:
  # The DLSS SDK is public and this is the commit the project was built and
  # tested against. A moving target here would make the same tag build two
  # different binaries on two different days.
  DLSS_SDK_COMMIT: a291cc7d2cc642a51566f3dfd5376f635cd1b284

  # Where the four third-party binaries come from. They are never in the tree
  # (I11), and the software never downloads anything -- this job does, once,
  # from the archive the upstream author published, and checks every file
  # against the digests pinned below before it goes anywhere near the bundle.
  # A repository variable of the same name overrides the URL, for the day the
  # upstream asset is gone and the files have to be re-hosted.
  THIRD_PARTY_BUNDLE_URL: ${{ vars.THIRD_PARTY_BUNDLE_URL || 'https://github.com/xilla420/dlss5-wow-sidecar/releases/download/v0.1.2/dlss5-wow-sidecar-v0.1.2.zip' }}

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check pefile pytest

      # The tag and the VERSION in CMakeLists are the same number written in two
      # places, and two places drift. This is where that is caught -- before a
      # release goes out whose window title disagrees with its own tag.
      - name: Check the tag against the project version
        shell: pwsh
        run: |
          $ref = "${{ github.event.inputs.tag || github.ref_name }}"
          $tag = $ref -replace '^refs/tags/', ''
          $version = $tag.TrimStart('v')
          $declared = (Select-String -Path CMakeLists.txt -Pattern 'project\(.*VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          Write-Output "tag $tag, CMakeLists says $declared"
          if ($version -ne $declared) {
            Write-Error "Tag $tag does not match the VERSION in CMakeLists.txt ($declared). One of them is wrong; the version lives in CMakeLists."
            exit 1
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The notes were written when the change was made. Reading them back beats
      # typing them a second time into the release form, where the two versions
      # then disagree and the reader gets whichever they find first.
      - name: Take the release notes from the changelog
        shell: pwsh
        run: python ci/release_notes.py $env:VERSION | Out-File -FilePath release-notes.md -Encoding utf8

      # Public, and pinned. Cloned without the blobs and with only the two
      # directories the build reads: the headers, and the x64 import library.
      # The repository also carries every runtime DLL for every platform, and
      # that is several hundred megabytes of nothing this build needs.
      - name: Fetch the NVIDIA DLSS SDK
        shell: pwsh
        run: |
          git clone --filter=blob:none --sparse --no-checkout https://github.com/NVIDIA/DLSS sdk-dlss
          cd sdk-dlss
          git sparse-checkout set include lib/Windows_x86_64/x64
          git checkout --quiet $env:DLSS_SDK_COMMIT
          if (-not (Test-Path lib/Windows_x86_64/x64/nvsdk_ngx_d.lib)) {
            Write-Error "The DLSS SDK checkout has no nvsdk_ngx_d.lib; the layout has changed."
            exit 1
          }

      # The Optical Flow SDK is not fully public: NVIDIA's GitHub repository
      # carries the CUDA interface only, and this project needs the D3D12
      # header, which ships in the download behind a developer account.
      #
      # So the two headers under NvOFInterface/ have to be supplied by the
      # repository itself, as a secret. Two forms are accepted:
      #
      #   NVOF_SDK_B64  a zip of the NvOFInterface directory, base64-encoded.
      #                 About 15 KB; needs no hosting anywhere. Preferred.
      #   NVOF_SDK_URL  a URL to an archive holding NvOFInterface/, for a
      #                 repository that already has somewhere to keep one.
      #
      # Without either the job stops here rather than building something that
      # cannot work: with no Optical Flow SDK there is no motion field, the
      # neural pass is skipped for every frame, and the binaries look finished
      # while doing nothing at all.
      - name: Fetch the NVIDIA Optical Flow SDK
        shell: pwsh
        env:
          NVOF_SDK_B64: ${{ secrets.NVOF_SDK_B64 }}
          NVOF_SDK_URL: ${{ secrets.NVOF_SDK_URL }}
        run: |
          $ProgressPreference = 'SilentlyContinue'
          if ($env:NVOF_SDK_B64) {
            [IO.File]::WriteAllBytes("nvof.zip", [Convert]::FromBase64String($env:NVOF_SDK_B64))
            Write-Output "Optical Flow SDK taken from NVOF_SDK_B64."
          } elseif ($env:NVOF_SDK_URL) {
            Invoke-WebRequest -Uri $env:NVOF_SDK_URL -OutFile nvof.zip
            Write-Output "Optical Flow SDK taken from NVOF_SDK_URL."
          } else {
            Write-Error @"
          Neither NVOF_SDK_B64 nor NVOF_SDK_URL is set.

          One of them has to supply NvOFInterface/ from the NVIDIA Optical Flow
          SDK. NVIDIA publishes only the CUDA headers on GitHub; the D3D12 header
          this project includes comes with the download behind a developer
          account, so it cannot be fetched here without one.

          To set the preferred form, from a checkout that has the SDK:
            Compress-Archive third_party/Optical-Flow-SDK/NvOFInterface nvof.zip
            gh secret set NVOF_SDK_B64 --body ([Convert]::ToBase64String([IO.File]::ReadAllBytes('nvof.zip')))

          This job refuses to continue rather than publish a build without it. A
          sidecar built with no Optical Flow SDK starts, reports a neural pass,
          and never runs one -- there is no motion field, so every frame is
          copied through untouched and nothing on screen says so.
          "@
            exit 1
          }
          Expand-Archive -Path nvof.zip -DestinationPath sdk-nvof -Force
          $interface = Get-ChildItem -Path sdk-nvof -Recurse -Directory -Filter NvOFInterface | Select-Object -First 1
          if (-not $interface) { Write-Error "The archive has no NvOFInterface directory."; exit 1 }
          if (-not (Test-Path (Join-Path $interface.FullName 'nvOpticalFlowD3D12.h'))) {
            Write-Error "NvOFInterface has no nvOpticalFlowD3D12.h; this is the CUDA-only copy."
            exit 1
          }
          "NVOF_ROOT=$($interface.Parent.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # SIDECAR_REQUIRE_SDKS turns the "SDK not set" warnings into errors. A
      # release is the one build where a missing SDK must not be survivable.
      - name: Configure
        run: >
          cmake -S . -B build -A x64
          -DSIDECAR_REQUIRE_SDKS=ON
          -DDLSS_SDK_DIR=${{ github.workspace }}/sdk-dlss
          -DNVOF_SDK_DIR=${{ env.NVOF_ROOT }}

      - name: Build
        run: cmake --build build --config Release

      - name: Unit tests
        run: build\tests\Release\sidecar_tests.exe "[unit]"

      - name: Test the checkers themselves
        run: python -m pytest ci/test_check_imports.py ci/test_check_translations.py ci/test_release_notes.py -q

      - name: Check the translation table against the sources
        run: python ci/check_translations.py

      # The same invariants ci.yml checks, against the binaries that are about
      # to be published rather than against a debug build of them.
      - name: Re-check the binaries against the safety invariants
        run: python ci/check_imports.py build\Release\wowsidecar.exe build\Release\wowsidecar-manager.exe

      # Verify all four upstream binaries, including the E67DEE neural runtime.
      # A user reported clean output with this runtime on an RTX 3060.
      - name: Fetch the third-party binaries and check them
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $expected = [ordered]@{
            'nvngx_dlssnr.dll'     = 'e67dee209320cdafe0e93e45675d7aa34323a53acc57a72b2e40a181581c989a'
            'nvngx_dlss.dll'       = 'c85f971ce023c9f3492fc7455f0b01a24ba18ea39636407a846902c4360b0b7e'
            'dxgi.dll'             = '0cee63f9c9f13f3ac909c5b4903f4dbb4b719a7ab3b4f13b0deaf83c814b94f7'
            'renodx-dlss5.addon64' = 'e1c28fde0922b12fc10734e58c3d24a36808e575247f4fd4f36226540d7ee023'
          }
          Write-Output "Fetching $env:THIRD_PARTY_BUNDLE_URL"
          Invoke-WebRequest -Uri $env:THIRD_PARTY_BUNDLE_URL -OutFile third-party.zip
          Expand-Archive -Path third-party.zip -DestinationPath third-party -Force
          New-Item -ItemType Directory -Path third-party-verified | Out-Null
          $failed = $false
          foreach ($name in $expected.Keys) {
            $file = Get-ChildItem -Path third-party -Recurse -File -Filter $name | Select-Object -First 1
            if (-not $file) {
              Write-Output "::error::$name is not in the third-party archive."
              $failed = $true
              continue
            }
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $expected[$name]) {
              Write-Output "::error::$name has digest $hash, expected $($expected[$name]). The file behind the URL has changed; do not publish it unread."
              $failed = $true
              continue
            }
            Copy-Item $file.FullName third-party-verified
            Write-Output "$name  $hash  ok"
          }
          if ($failed) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          $stage = "dlss5-wow-sidecar"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item build\Release\wowsidecar.exe, build\Release\wowsidecar-manager.exe $stage
          Copy-Item third-party-verified\* $stage
          # The Recommended preset, so the first launch is the tuned one rather
          # than whatever the defaults happen to be that day.
          Copy-Item assets\sidecar.toml $stage
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md $stage
          $zip = "dlss5-wow-sidecar-$env:TAG.zip"
          Compress-Archive -Path $stage -DestinationPath $zip
          # Published beside the archive so anyone can check what they
          # downloaded is what was built -- and, per file, what was bundled.
          $lines = @()
          $lines += "$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())  $zip"
          foreach ($file in Get-ChildItem -Path $stage -File | Sort-Object Name) {
            $lines += "$((Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower())  $stage/$($file.Name)"
          }
          $lines | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Published, not drafted: everything a person would have added by hand is
      # already in the archive and was checked on the way in. The notes say what
      # the bundle holds and where each piece came from, because a reader who
      # did not see this file should still be able to tell.
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "release-notes.md"
          @"

          ---

          ## Contents

          Everything needed to run, in one download. Unzip anywhere -- **not**
          into your World of Warcraft folder -- and run ``wowsidecar-manager.exe``.

          Both executables, built from this tag with both NVIDIA SDKs present
          (the job refuses to run without them, because a build missing either
          one reports a neural pass and never runs one); the DLSS 5 neural
          rendering runtime (upstream E67DEE compatibility build, reported to
          render correctly on an RTX 3060). Also included: the DLSS
          upscaling runtime; ReShade 6.8 with add-on support; the RenoDX DLSS 5
          add-on; and a ``sidecar.toml`` set to the Recommended preset.

          All four third-party binaries match the upstream 0.1.2 release.
          All four are verified by SHA-256 before packaging.
          They belong to their authors and
          are covered by their own terms, not this project's MIT licence -- see
          ``THIRD-PARTY-NOTICES.md`` in the archive.

          RTX 20/30 support remains experimental. Clean rendering has been
          reported on an RTX 3060; Turing validation remains pending.
          Windows 11 and WoW in borderless windowed mode are required.
          The custom C23D039 runtime previously bundled with v0.3.2 produced
          severe visual artifacts on the RTX 3060 and is no longer bundled.
          Low frame rates remain possible on older GPUs.
          Read *About frame rate* in the README before judging performance.

          ``SHA256SUMS.txt`` covers the archive and every file inside it.
          "@ | Out-File -FilePath $notes -Append -Encoding utf8

          gh release create $env:TAG $env:ZIP SHA256SUMS.txt `
            --title "$env:TAG - DLSS 5 Sidecar" `
            --notes-file $notes --prerelease
